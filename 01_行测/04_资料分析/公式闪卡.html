<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>公式闪卡 · 循环</title>
<style>
:root{--ink:#1c1c1e;--muted:#6b6b70;--line:#e6e4df;--bg:#f6f5f2;--card:#fff;--green:#1e7a4b;--green-bg:#eaf6ef;--red:#b3261e;--red-bg:#fdeeed;--blue:#1f5fbf;--blue-bg:#eaf1fb}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"PingFang SC","Microsoft YaHei",system-ui,-apple-system,sans-serif;line-height:1.75;-webkit-font-smoothing:antialiased}
.wrap{max-width:720px;margin:0 auto;padding:28px 20px 80px}
h1{font-size:22px;margin:0 0 6px}
.sub{color:var(--muted);font-size:14px;margin:0 0 18px}
.bar{display:flex;gap:16px;font-size:13px;color:var(--muted);margin-bottom:12px;flex-wrap:wrap}
.bar b{color:var(--ink);font-variant-numeric:tabular-nums}
.prog{height:6px;background:#eceae4;border-radius:99px;overflow:hidden;margin-bottom:18px}
.prog i{display:block;height:100%;background:var(--green);border-radius:99px;transition:width .25s}
.board{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:36px 28px;text-align:center;min-height:300px;display:flex;flex-direction:column;justify-content:center}
.board .tag{display:inline-block;font-size:11px;background:var(--blue-bg);color:var(--blue);border-radius:999px;padding:1px 9px;margin-bottom:14px}
.board .q{font-size:24px;font-weight:700;line-height:1.5}
.board .a{font-size:27px;font-weight:700;color:var(--green);margin-top:20px;font-family:ui-monospace,Consolas,monospace;word-break:break-all}
.board .a.hide{display:none}
.board .g{font-size:14px;color:#444;margin-top:12px;background:#f3f2ee;border-radius:9px;padding:10px 14px;text-align:left;display:none}
.board .g.on{display:block}
.board .note{font-size:13px;color:var(--muted);margin-top:14px}
.board .miss{font-size:12.5px;color:var(--red);margin-top:6px;min-height:20px}
.actions{display:flex;gap:10px;margin-top:16px}
button{border-radius:10px;padding:13px 18px;font:inherit;font-size:15px;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--ink)}
button.wide{flex:1}
button.dark{background:var(--ink);color:#fff;border:0}
button.ok{background:var(--green-bg);border-color:#bfe3cd;color:var(--green)}
button.no{background:var(--red-bg);border-color:#f0c9c6;color:var(--red)}
.hint{font-size:12.5px;color:var(--muted);margin-top:18px}
.done{display:none}
.done.on{display:block}
table{width:100%;border-collapse:collapse;font-size:13.5px;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-top:14px}
th,td{padding:8px 12px;border-bottom:1px solid var(--line);text-align:left}
th{color:var(--muted);font-weight:500;font-size:12.5px;background:#f3f2ee}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
code{font-variant-numeric:tabular-nums}
</style>
</head>
<body>
<div class="wrap">
  <h1>公式闪卡 · 循环</h1>
  <p class="sub">说对了才出队；没记住的排回队尾。16 张全部出队才算过一轮，每张卡的错次会跨天累计。</p>

  <div class="bar">
    <span>剩余 <b id="left">12</b> 张</span>
    <span>已掌握 <b id="got">0</b> / 16</span>
    <span>本次点选 <b id="taps">0</b> 次</span>
    <span id="clock">00:00</span>
  </div>
  <div class="prog"><i id="pi" style="width:0%"></i></div>

  <div class="board" id="board">
    <div><span class="tag" id="tag">基期</span></div>
    <div class="q" id="q">求基期量（增长型）</div>
    <div class="a hide" id="a"></div>
    <div class="g" id="g"></div>
    <div class="note" id="note">先自己想，三秒说不出就点「没记住」</div>
    <div class="miss" id="miss"></div>
  </div>

  <div class="actions" id="act1">
    <button class="dark wide" id="reveal">揭晓式子</button>
  </div>
  <div class="actions" id="act2" style="display:none">
    <button class="ok wide" id="yes">说对了，出队</button>
    <button class="no wide" id="no">没记住，排回队尾</button>
  </div>

  <div class="done" id="done"></div>

  <p class="hint">跨天还错的卡，通常问题出在理解，不在记忆：回 <a href="../记忆卡.html">记忆卡</a> 把那张卡的解释再读一遍。</p>
</div>

<script>
var CARDS = [
  { id: "base_up", q: "求基期量（增长型）", a: "现期 ÷ (1 + r)", g: "<b>现期</b>＝材料给的本年数　<b>r</b>＝同比增长率", tag: "基期" },
  { id: "base_down", q: "求基期量（下降型）", a: "现期 ÷ (1 - r)", g: "<b>下降</b>时括号里是减号，仍然是除", tag: "基期" },
  { id: "present", q: "已知基期和增速，求现期", a: "基期 × (1 + r)", g: "<b>基期</b>＝上年数　求今年用乘", tag: "现期" },
  { id: "delta", q: "求增长量（今年减去年）", a: "现期 − 现期 ÷ (1+r)　＝　现期 × r ÷ (1+r)", g: "左边是<b>含义</b>：今年 − 去年；右边是<b>算法</b>：快，且 r/(1+r) 可查表。两者完全等价。<br>例：今年 110、增 10% → 去年 100 → 110−100=10；或 110×0.1÷1.1=10。<br>自检：结果一定小于「现期×r」（r=10% 时系数约 9%）。", tag: "增长量" },
  { id: "rate", q: "求增长率", a: "(现期 - 基期) ÷ 基期", g: "也等于 <b>现期 ÷ 基期 - 1</b>；材料直接给 r 时不用算", tag: "增长率" },
  { id: "share", q: "求比重", a: "部分 ÷ 整体", g: "例：企业 4.2 万 ÷ 经营主体 12.8 万", tag: "比重" },
  { id: "share_dir", q: "判断比重升降", a: "比 a 与 b", g: "<b>a</b>＝你要比较的那部分（企业 4.2 万）的增速 11.4%　<b>b</b>＝它所在整体（经营主体 12.8 万）的增速 6.7%　→ a>b，升", tag: "比重" },
  { id: "share_amp", q: "求比重变化幅度", a: "现期比重 × (a - b) ÷ (1 + a)", g: "记住三样：<b>现期</b>比重 × <b>增速差</b>(a−b) ÷ (1+<b>部分</b>增速)。三个坑：不是基期比重、不是减 b、不是 (1+b)。<br>量级自检：结果一般 1–3 个百分点，算出十几个百分点必错。<br>先算方向：a>b 升，a<b 降。", tag: "比重" },
  { id: "avg", q: "求平均数（户均/人均）", a: "总量 ÷ 个数", g: "户均＝罚没款÷案件数　人均＝收入÷人数", tag: "平均数" },
  { id: "avg_chg", q: "求平均数变化率", a: "(1 + a) ÷ (1 + b) - 1", g: "先定谁是分子：户均＝罚没款÷案件数，所以 <b>a</b>＝罚没款增速 -12.6%，<b>b</b>＝案件数增速 +8.5%　代入：0.874÷1.085-1≈-19.4%", tag: "平均数" },
  { id: "times", q: "A 是 B 的几倍", a: "A ÷ B", g: "直接除，不减 1", tag: "倍数" },
  { id: "pct", q: "A 比 B 多百分之几", a: "(A - B) ÷ B", g: "分母跟「<b>比</b>」字后面那个数走", tag: "比较" },
  { id: "whole", q: "已知部分与比重，求整体", a: "部分 ÷ 比重", g: "比重 = 部分 ÷ 整体，反过来整体 = 部分 ÷ 比重。<br>例：企业 4.2 万，占比 32.8% → 整体 = 4.2 ÷ 0.328 ≈ 12.8", tag: "比重" },
  { id: "interval", q: "隔年增长率（隔一年）", a: "r1 + r2 + r1 × r2", g: "<b>r1</b>、<b>r2</b> 是相邻两年的增速。后两项通常很小，先算 r1+r2，再加 r1×r2。<br>例：0.1+0.2+0.02 = 0.32（32%）", tag: "增长率" },
  { id: "annual", q: "年均增长率", a: "(现期 ÷ 基期)^(1/n) − 1", g: "n 是年数（间隔几年，不是第几年）。考场上多为比较大小，少硬算。<br>估算：翻番约每年 7.2%（72 法则）", tag: "增长率" },
  { id: "delta_cmp", q: "比较谁的增长量大", a: "比 现期 × r（不除 (1+r)）", g: "只比大小，两个 r 接近时直接比乘积即可，不必算出结果。<br>严格式仍要除 (1+r)，但同数量级下省略不影响排序", tag: "增长量" }
];

var LS = "kaogong_flash_v1";
var queue = [], cur = null, got = 0, taps = 0, t0 = 0, timer = null, history = {};

function el(id) { return document.getElementById(id); }
function shuffle(a) { for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
function fmt(s) { var m = String(Math.floor(s / 60)).padStart(2, "0"); return m + ":" + String(s % 60).padStart(2, "0"); }
function tick() { el("clock").textContent = fmt(Math.floor((Date.now() - t0) / 1000)); }

function loadHist() { try { return JSON.parse(localStorage.getItem(LS) || "{}"); } catch (e) { return {}; } }
function saveHist() { try { localStorage.setItem(LS, JSON.stringify(history)); } catch (e) {} }

function init() {
  history = loadHist();
  queue = shuffle(CARDS.slice());
  got = 0; taps = 0; t0 = Date.now();
  if (timer) clearInterval(timer);
  timer = setInterval(tick, 1000);
  el("done").classList.remove("on");
  el("board").style.display = "flex";
  next();
}

function next() {
  if (!queue.length) { finish(); return; }
  cur = queue[0];
  el("tag").textContent = cur.tag;
  el("q").textContent = cur.q;
  el("a").textContent = cur.a;
  el("a").classList.add("hide");
  el("g").innerHTML = cur.g;
  el("g").classList.remove("on");
  el("note").textContent = "先自己想，三秒说不出就点「没记住」";
  var h = history[cur.id] || { ok: 0, miss: 0 };
  el("miss").textContent = h.miss ? "这张卡你以前错过 " + h.miss + " 次" : "";
  el("act1").style.display = "flex";
  el("act2").style.display = "none";
  render();
}

function render() {
  el("left").textContent = queue.length;
  el("got").textContent = got;
  el("taps").textContent = taps;
  el("pi").style.width = Math.round(got * 100 / CARDS.length) + "%";
}

function reveal() {
  el("a").classList.remove("hide");
  el("g").classList.add("on");
  el("note").textContent = "对上了点左，对不上点右";
  el("act1").style.display = "none";
  el("act2").style.display = "flex";
}

function answer(ok) {
  taps++;
  var h = history[cur.id] || { ok: 0, miss: 0 };
  if (ok) {
    h.ok++; history[cur.id] = h; saveHist();
    queue.shift();
    got++;
    postLog({ kind: "flash", card: cur.id, q: cur.q, ok: true });
  } else {
    h.miss++; history[cur.id] = h; saveHist();
    var c = queue.shift();
    var pos = Math.min(queue.length, 2 + Math.floor(Math.random() * 3));
    queue.splice(pos, 0, c);
    postLog({ kind: "flash", card: cur.id, q: cur.q, ok: false });
  }
  if (queue.length) { next(); } else { finish(); }
}

function finish() {
  render();
  clearInterval(timer);
  var sec = Math.floor((Date.now() - t0) / 1000);
  var totalMiss = 0, rows = "";
  CARDS.forEach(function (c) {
    var h = history[c.id] || { ok: 0, miss: 0 };
    totalMiss += h.miss;
    rows += "<tr><td>" + c.q + "</td><td class='n'>" + h.miss + "</td><td class='n'>" + h.ok + "</td></tr>";
  });
  el("board").style.display = "none";
  el("act1").style.display = "none";
  el("act2").style.display = "none";
  var d = el("done");
  d.classList.add("on");
  d.innerHTML = '<div class="board" style="min-height:auto"><div class="q">全部出队</div>' +
    '<div class="note">本次点选 ' + taps + " 次　用时 " + fmt(sec) + "　累计错误 " + totalMiss + " 次</div>" +
    '<div style="margin-top:18px"><button class="dark" id="again">再来一轮（全部）</button></div></div>' +
    "<table><tr><th>卡片</th><th class='n'>累计错</th><th class='n'>累计对</th></tr>" + rows + "</table>";
  el("again").addEventListener("click", function () { init(); });
  postLog({ kind: "flash_session", taps: taps, sec: sec, misses: totalMiss });
}

function postLog(obj) {
  try {
    if (location.protocol === "file:") return;
    fetch("/api/log", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(obj) }).catch(function () {});
  } catch (e) {}
}

el("reveal").addEventListener("click", reveal);
el("yes").addEventListener("click", function () { answer(true); });
el("no").addEventListener("click", function () { answer(false); });
init();
</script>
</body>
</html>
