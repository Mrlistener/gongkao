<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>平均数变化 · 6 题</title>
<style>
:root{--ink:#1c1c1e;--muted:#6b6b70;--line:#e6e4df;--bg:#f6f5f2;--card:#fff;--blue:#1f5fbf;--blue-bg:#eaf1fb;--green:#1e7a4b;--green-bg:#eaf6ef;--red:#b3261e;--red-bg:#fdeeed}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"PingFang SC","Microsoft YaHei",system-ui,-apple-system,sans-serif;line-height:1.7;-webkit-font-smoothing:antialiased}
.wrap{max-width:780px;margin:0 auto;padding:28px 20px 80px}
header h1{font-size:22px;margin:0 0 6px;letter-spacing:.5px}
.sub{margin:0;color:var(--muted);font-size:14px}
.hud{display:flex;gap:18px;align-items:center;margin:16px 0 22px;padding:12px 16px;background:var(--card);border:1px solid var(--line);border-radius:12px;font-size:14px;position:sticky;top:8px;z-index:9}
.hud .t{font-variant-numeric:tabular-nums;font-weight:600;font-size:17px;letter-spacing:1px}
.hud .grow{flex:1}
.hud .p{color:var(--muted)}
.material{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px;font-size:15px;margin-bottom:18px}
.material p{margin:0 0 10px}
.material p:last-child{margin:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px 18px;margin-bottom:14px}
.stem{font-size:15px;margin:0 0 12px;font-weight:600}
.stem .no{display:inline-block;min-width:22px;color:var(--muted);font-weight:400;font-variant-numeric:tabular-nums}
.opt{display:flex;gap:10px;width:100%;text-align:left;background:#fbfbfa;border:1px solid var(--line);border-radius:10px;padding:11px 13px;margin:7px 0;font:inherit;font-size:14.5px;color:inherit;cursor:pointer;transition:border-color .12s,background .12s}
.opt:hover{border-color:#c9c5bd}
.opt .k{flex:none;width:20px;color:var(--muted);font-weight:600}
.opt.sel{border-color:var(--blue);background:var(--blue-bg)}
.opt.ok{border-color:var(--green);background:var(--green-bg)}
.opt.no{border-color:var(--red);background:var(--red-bg)}
.opt.lock{cursor:default}
.opt.lock:hover{border-color:var(--line)}
.opt.ok.lock:hover{border-color:var(--green)}
.opt.no.lock:hover{border-color:var(--red)}
.sol{display:none;margin-top:12px;padding-top:12px;border-top:1px dashed var(--line);font-size:14px;color:#333}
.sol.show{display:block}
.sol b{color:var(--ink)}
.tag{display:inline-block;font-size:12px;padding:1px 8px;border-radius:999px;margin-left:8px;vertical-align:2px}
.tag.ok{background:var(--green-bg);color:var(--green)}
.tag.no{background:var(--red-bg);color:var(--red)}
.actions{display:flex;gap:10px;margin:22px 0 8px}
button.primary{flex:1;background:var(--ink);color:#fff;border:0;border-radius:10px;padding:13px;font:inherit;font-size:15px;cursor:pointer}
button.primary:disabled{opacity:.35;cursor:not-allowed}
button.ghost{background:transparent;border:1px solid var(--line);border-radius:10px;padding:13px 18px;font:inherit;font-size:15px;color:var(--muted);cursor:pointer}
.result{display:none;margin-top:16px;padding:18px;background:var(--card);border:1px solid var(--line);border-radius:12px}
.result.show{display:block}
.result .big{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums}
.result .row{display:flex;gap:24px;flex-wrap:wrap;align-items:baseline;margin-bottom:10px}
.result .lab{color:var(--muted);font-size:13px}
.wronglist{margin:6px 0 0;padding-left:18px;font-size:14px;color:#444}
.history{margin-top:34px;border-top:1px solid var(--line);padding-top:16px}
.history h3{font-size:14px;color:var(--muted);font-weight:500;margin:0 0 8px}
.history ul{list-style:none;margin:0;padding:0;font-size:13px;color:var(--muted)}
.history li{display:flex;gap:12px;padding:5px 0;border-bottom:1px dotted #ececea;font-variant-numeric:tabular-nums}
.history li span:first-child{flex:1}
.hint{font-size:12.5px;color:var(--muted);margin-top:10px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>平均数变化 · 6 题</h1>
    <p class="sub">6 题 · 先判方向再算数 · 建议 6 分钟</p>
  </header>

  <div class="hud">
    <div class="t" id="timer">00:00</div>
    <div class="grow p" id="progress">已答 0 / 0</div>
    <div class="p" id="hintbar">计时中</div>
  </div>

  <section class="material" id="material" data-set="平均数变化 · 6 题"><p><b>规则</b>：每题都给两个增速——<b>a</b> 是分子（总量）的增速，<b>b</b> 是分母（个数）的增速。户均/人均/亩产这类平均数，变化率 = (1+a) ÷ (1+b) − 1。</p><p><b>下笔顺序</b>：① 先比 1+a 与 1+b 谁大，定升降；② 再算倍数商；③ 算完回头看一眼方向对不对。</p></section>
  <main id="questions"></main>

  <div class="actions">
    <button class="primary" id="submit" disabled>交卷</button>
    <button class="ghost" id="reset">重做</button>
  </div>

  <section class="result" id="result"></section>

  <section class="history">
    <h3>本机练习记录（只存这台电脑的浏览器里）</h3>
    <ul id="history"></ul>
    <p class="hint">离线可用，答案只在本页判定，不会上传。错题会自动记进 <a id="wbLink" href="../错题集.html">错题集</a>。</p>
  </section>
</div>

<script>
const QUIZ = [{"stem": "某局罚没款同比增长 20%，查处案件数同比增长 25%。户均罚没款比上年：", "options": ["下降约 4%", "上升约 4%", "下降约 5%", "上升约 5%"], "answer": 0, "type": "平均数变化（同向）", "solution": "<b>先判方向</b>：分子 1.2 倍 ＜ 分母 1.25 倍 → 分母涨得快 → 平均数<b>下降</b>，先在 C、D 里挑，A、B 直接排除。<br><b>再算</b>：1.2 ÷ 1.25 = 0.96 → 降 4%。<br><b>坑一</b>：算成 1.25 ÷ 1.2 = 1.042 → 选「上升 4%」，这是分子分母颠倒。<br><b>坑二</b>：20% − 25% = −5% → 选「下降 5%」，这是把两个率相减。"}, {"stem": "某局罚没款同比增长 15%，查处案件数同比下降 5%。户均罚没款比上年：", "options": ["上升约 10%", "上升约 21%", "下降约 10%", "上升约 15%"], "answer": 1, "type": "平均数变化（一升一降）", "solution": "<b>先判方向</b>：分子 1.15 倍 ＞ 分母 0.95 倍 → 分子涨、分母跌，平均数<b>必涨</b>，而且涨得比 15% 还多。<br><b>再算</b>：1.15 ÷ 0.95 = 1.2105 → 涨 21%。<br><b>为什么不是 10%</b>：15% − 5% = 10% 是把「除以 0.95」当成了「减 5%」。分母跌 5% 等于再乘 1÷0.95 = 1.0526，两个效果<b>相乘</b>：1.15 × 1.0526 = 1.2105。"}, {"stem": "某局罚没款同比下降 10%，查处案件数同比下降 20%。户均罚没款比上年：", "options": ["下降约 12.5%", "上升约 12.5%", "下降约 10%", "上升约 10%"], "answer": 1, "type": "平均数变化（双降，平均数反涨）", "solution": "<b>先判方向</b>：分子 0.9 倍 ＞ 分母 0.8 倍 → 钱降得慢、案子降得快，摊到更少的案子上，户均<b>反涨</b>。这题专破「两个都在降，平均数一定降」的直觉。<br><b>再算</b>：0.9 ÷ 0.8 = 1.125 → 涨 12.5%。<br><b>坑</b>：−10% − (−20%) = 10%，连方向都反了。"}, {"stem": "某局罚没款同比下降 12.6%，查处案件数同比增长 8.5%。户均罚没款比上年：", "options": ["下降约 19.4%", "下降约 4.1%", "下降约 21.1%", "上升约 19.4%"], "answer": 0, "type": "平均数变化（一降一升）", "solution": "<b>先判方向</b>：分子 0.874 倍 ＜ 分母 1.085 倍 → 必降，而且比 12.6% 跌得更狠。<br><b>再算</b>：0.874 ÷ 1.085 = 0.8055 → 降 19.4%。<br><b>两个坑都在选项里</b>：−12.6% + 8.5% = −4.1%（B）；−12.6% − 8.5% = −21.1%（C）。<br>这就是第 1 套第 4 题，也是闪卡 avg_chg 那张。"}, {"stem": "某局罚没款同比增长 8%，查处案件数同比增长 8%。户均罚没款比上年：", "options": ["上升约 8%", "下降约 8%", "基本不变", "上升约 16%"], "answer": 2, "type": "平均数变化（同速）", "solution": "<b>1.08 ÷ 1.08 = 1 → 不变。</b><br>分子分母同速，平均数不动——这是最便宜的自检：<b>两个增速一样时，答案必须是 0</b>。公式要是给不出 0，公式就记错了。"}, {"stem": "某局罚没款同比增长 25%，查处案件数同比增长 20%。户均罚没款比上年：", "options": ["上升约 4.2%", "下降约 4.2%", "上升约 5%", "上升约 45%"], "answer": 0, "type": "平均数变化（分子快，幅度很小）", "solution": "<b>先判方向</b>：1.25 ＞ 1.2 → 升。<br><b>再算</b>：1.25 ÷ 1.2 = 1.0417 → 只涨 4.2%，比直觉小得多。<br><b>这题和第 1 题是一对</b>：同样 20% 和 25%，谁是分子谁是分母，答案一个 +4.2%、一个 −4%。<br>所以这个公式唯一要小心的地方，就是<b>别把 a、b 装反</b>——装反了不只符号错，数也对不上。"}];
const KEY = "kaogong_quiz_history_v1";
const KEYW = "kaogong_wrong_v1";
const WRONGBOOK = "../错题集.html";
const el = function (id) { return document.getElementById(id); };
const st = { answers: {}, start: Date.now(), submitted: false, timer: null };

function fmt(sec) {
  const m = String(Math.floor(sec / 60)).padStart(2, "0");
  const s = String(sec % 60).padStart(2, "0");
  return m + ":" + s;
}
function elapsed() { return Math.floor((Date.now() - st.start) / 1000); }
function tick() {
  if (st.submitted) return;
  el("timer").textContent = fmt(elapsed());
}
function answeredCount() { return Object.keys(st.answers).length; }
function updateHud() {
  el("progress").textContent = "已答 " + answeredCount() + " / " + QUIZ.length;
  el("submit").disabled = answeredCount() === 0;
  const n = answeredCount();
  el("hintbar").textContent = n === QUIZ.length ? "可以交卷了" : (n === 0 ? "计时中" : "还有 " + (QUIZ.length - n) + " 题");
}
function render() {
  const box = el("questions");
  QUIZ.forEach(function (q, qi) {
    const card = document.createElement("div");
    card.className = "card";
    card.id = "card-" + qi;
    const stem = document.createElement("p");
    stem.className = "stem";
    stem.innerHTML = '<span class="no">' + (qi + 1) + '.</span>' + q.stem;
    card.appendChild(stem);
    q.options.forEach(function (text, oi) {
      const b = document.createElement("button");
      b.className = "opt";
      b.type = "button";
      b.dataset.q = qi;
      b.dataset.o = oi;
      b.innerHTML = '<span class="k">' + "ABCD"[oi] + '</span><span class="t">' + text + '</span>';
      b.addEventListener("click", function () { pick(qi, oi); });
      card.appendChild(b);
    });
    const sol = document.createElement("div");
    sol.className = "sol";
    sol.id = "sol-" + qi;
    sol.innerHTML = q.solution;
    card.appendChild(sol);
    box.appendChild(card);
  });
  updateHud();
}
function pick(qi, oi) {
  if (st.submitted) return;
  st.answers[qi] = oi;
  const card = el("card-" + qi);
  const opts = card.querySelectorAll(".opt");
  for (let i = 0; i < opts.length; i++) {
    opts[i].classList.toggle("sel", i === oi);
  }
  updateHud();
}
function submit() {
  if (st.submitted) return;
  if (answeredCount() < QUIZ.length) {
    const left = QUIZ.length - answeredCount();
    if (!confirm("还有 " + left + " 题没答，确定交卷？")) return;
  }
  st.submitted = true;
  clearInterval(st.timer);
  el("hintbar").textContent = "已交卷";
  el("submit").disabled = true;
  let right = 0;
  const wrong = [];
  const wrongFull = [];
  QUIZ.forEach(function (q, qi) {
    const card = el("card-" + qi);
    const opts = card.querySelectorAll(".opt");
    const mine = st.answers[qi];
    for (let i = 0; i < opts.length; i++) {
      opts[i].classList.add("lock");
      opts[i].classList.remove("sel");
      if (i === q.answer) opts[i].classList.add("ok");
      if (i === mine && mine !== q.answer) opts[i].classList.add("no");
    }
    const ok = mine === q.answer;
    if (ok) { right++; }
    else {
      wrong.push({ no: qi + 1, type: q.type, mine: mine === undefined ? "未作答" : "ABCD"[mine], ans: "ABCD"[q.answer] });
      wrongFull.push({ stem: q.stem, options: q.options, mine: mine, answer: q.answer, type: q.type, solution: q.solution });
    }
    const tag = document.createElement("span");
    tag.className = "tag " + (ok ? "ok" : "no");
    tag.textContent = ok ? "正确" : (mine === undefined ? "未作答" : "错误");
    card.querySelector(".stem").appendChild(tag);
    el("sol-" + qi).classList.add("show");
  });
  const sec = elapsed();
  const res = el("result");
  res.classList.add("show");
  let html = '<div class="row"><div><div class="lab">得分</div><div class="big">' + right + " / " + QUIZ.length + '</div></div>';
  html += '<div><div class="lab">用时</div><div class="big">' + fmt(sec) + '</div></div>';
  html += '<div><div class="lab">正确率</div><div class="big">' + Math.round(right * 100 / QUIZ.length) + '%</div></div></div>';
  if (wrong.length) {
    html += '<div class="lab">错题类型（这个比分数重要）</div><ul class="wronglist">';
    wrong.forEach(function (w) {
      html += '<li>第 ' + w.no + ' 题 · ' + w.type + '　你选 ' + w.mine + '，正确答案 ' + w.ans + '</li>';
    });
    html += '</ul><p class="hint">把这几类抄进错题本，明天换数字自己出 3 道同型题。</p>';
  } else {
    html += '<p class="hint">全对。把这张表的下一个难度档提上来，或者直接进下一套。</p>';
  }
  var summary = el("material").dataset.set || document.title;
  summary += "　" + right + "/" + QUIZ.length + "　用时" + fmt(sec);
  if (wrong.length) {
    summary += "；错题：" + wrong.map(function (w) { return "第" + w.no + "题(" + w.type + ")"; }).join("、");
  }
  html += '<div class="actions" style="margin-top:14px"><button class="ghost" id="copyRes">复制结果（发给我）</button></div>';
  res.innerHTML = html;
  el("copyRes").addEventListener("click", function () {
    var ok = false;
    try { navigator.clipboard.writeText(summary); ok = true; } catch (e) { ok = false; }
    if (!ok) {
      var ta = document.createElement("textarea");
      ta.value = summary; document.body.appendChild(ta); ta.select();
      try { document.execCommand("copy"); ok = true; } catch (e2) {}
      document.body.removeChild(ta);
    }
    this.textContent = ok ? "已复制，粘贴发我就行" : "复制失败，手动选中上面的文字";
  });
  save(sec, right);
  saveWrong(wrongFull);
  postLog({
    kind: "attempt",
    set: el("material").dataset.set || document.title,
    score: right,
    total: QUIZ.length,
    sec: sec,
    wrong: wrongFull.map(function (w) { return { stem: w.stem, type: w.type, mine: w.mine, answer: w.answer }; })
  });
  res.scrollIntoView({ behavior: "smooth", block: "center" });
}
function postLog(obj) {
  try {
    if (location.protocol === "file:") return;
    fetch("/api/log", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(obj)
    }).catch(function () {});
  } catch (e) {}
}

function saveWrong(items) {
  if (!items.length) return;
  try {
    const arr = JSON.parse(localStorage.getItem(KEYW) || "[]");
    const set = el("material").dataset.set || document.title;
    items.forEach(function (it) {
      const id = set + "|" + it.stem;
      const found = arr.filter(function (x) { return x.id === id; })[0];
      const rec = {
        id: id, set: set, stem: it.stem, options: it.options, mine: it.mine,
        answer: it.answer, type: it.type, solution: it.solution,
        at: new Date().toLocaleString("zh-CN"), times: 1
      };
      if (found) {
        found.times = (found.times || 1) + 1;
        found.mine = it.mine;
        found.at = rec.at;
      } else {
        arr.push(rec);
      }
    });
    localStorage.setItem(KEYW, JSON.stringify(arr.slice(-200)));
  } catch (e) {}
}

function save(sec, right) {
  try {
    const arr = JSON.parse(localStorage.getItem(KEY) || "[]");
    arr.push({ set: el("material").dataset.set || document.title, score: right, total: QUIZ.length, sec: sec, at: new Date().toLocaleString("zh-CN") });
    localStorage.setItem(KEY, JSON.stringify(arr.slice(-30)));
    renderHistory();
  } catch (e) {}
}
function renderHistory() {
  try {
    const arr = JSON.parse(localStorage.getItem(KEY) || "[]");
    const ul = el("history");
    ul.innerHTML = "";
    if (!arr.length) { ul.innerHTML = "<li><span>还没有记录</span><span></span></li>"; return; }
    arr.slice().reverse().forEach(function (x) {
      const li = document.createElement("li");
      li.innerHTML = "<span>" + x.at + "　" + x.set + "</span><span>" + x.score + "/" + x.total + "　" + fmt(x.sec) + "</span>";
      ul.appendChild(li);
    });
  } catch (e) {}
}
el("submit").addEventListener("click", submit);
el("reset").addEventListener("click", function () { location.reload(); });
render();
renderHistory();
st.timer = setInterval(tick, 1000);
tick();
</script>
</body>
</html>
