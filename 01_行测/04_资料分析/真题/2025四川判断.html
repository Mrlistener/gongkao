<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>2025 四川省考 · 判断推理 56–63</title>
<style>
:root{--ink:#1c1c1e;--muted:#6b6b70;--line:#e6e4df;--bg:#f6f5f2;--card:#fff;--green:#1e7a4b;--green-bg:#eaf6ef;--red:#b3261e;--red-bg:#fdeeed;--amber:#8a5a00;--amber-bg:#fdf4e3}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;line-height:1.7}
.wrap{max-width:820px;margin:0 auto;padding:24px 18px 80px}
h1{font-size:21px;margin:0 0 6px}
.sub{color:var(--muted);font-size:14px;margin:0 0 14px}
.bar{display:flex;gap:18px;font-size:13px;color:var(--muted);margin-bottom:14px;flex-wrap:wrap;align-items:center}
.bar b{color:var(--ink);font-variant-numeric:tabular-nums}
button{border-radius:10px;padding:10px 18px;font:inherit;font-size:14.5px;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--ink)}
button.dark{background:var(--ink);color:#fff;border:0}
.paper{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:16px}
.paper img{width:100%;display:block;border-radius:6px}
.qs{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:14px}
.qrow{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line)}
.qrow:last-child{border-bottom:0}
.qno{width:46px;font-weight:700;font-variant-numeric:tabular-nums}
.opt{width:42px;height:36px;display:flex;align-items:center;justify-content:center;border:1px solid var(--line);border-radius:8px;cursor:pointer;font-weight:600;user-select:none}
.opt.sel{background:var(--ink);color:#fff;border-color:var(--ink)}
.opt.ok{background:var(--green-bg);border-color:#bfe3cd;color:var(--green)}
.opt.no{background:var(--red-bg);border-color:#f0c9c6;color:var(--red)}
.res{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-top:12px;display:none}
.res.on{display:block}
.big{font-size:30px;font-weight:700}
.tip{background:var(--amber-bg);color:var(--amber);border-radius:9px;padding:10px 12px;font-size:13px;margin-bottom:14px}
</style>
</head>
<body>
<div class="wrap">
  <h1>2025 四川省考 · 判断推理（图形 56–63）</h1>
  <p class="sub">原卷三页 + 答题卡。62 题该卷解析缺失，已剔除。</p>
  <div class="bar">
    <span>已答 <b id="done">0</b> / 7</span>
    <span id="clock">00:00</span><span id="hint" style="font-size:12.5px;color:#6b6b70">点选项自动开始计时</span>
    <button class="dark" id="start">开始计时（也可直接点选项）</button>
  </div>
  <div class="tip">做法：先看原卷图里的图形，再在下面点选项。<b>不限时</b>，做不出来就停在那道题，记下题号。</div>

  <div class="paper"><img src="2025四川判断/p-10.png" alt="第10页"></div>
  <div class="paper"><img src="2025四川判断/p-11.png" alt="第11页"></div>
  <div class="paper"><img src="2025四川判断/p-12.png" alt="第12页"></div>
  <div class="paper"><img src="2025四川判断/p-13.png" alt="第13页"></div>

  <div class="qs" id="qs"></div>
  <button class="dark" id="submit">交卷</button>
  <section class="res" id="res"></section>
</div>
<script>
var QS = [["56","B"],["57","B"],["58","A"],["59","A"],["60","C"],["61","B"],["63","B"]];
var picked = {}, started = false, t0 = 0;
function el(id){return document.getElementById(id);}
function fmt(s){var m=String(Math.floor(s/60)).padStart(2,"0");return m+":"+String(s%60).padStart(2,"0");}
setInterval(function(){ if(started) el("clock").textContent = fmt(Math.floor((Date.now()-t0)/1000)); },1000);

var html = "";
QS.forEach(function(q,i){
  html += '<div class="qrow"><span class="qno">'+q[0]+'</span>';
  ["A","B","C","D"].forEach(function(c){
    html += '<span class="opt" data-i="'+i+'" data-c="'+c+'">'+c+'</span>';
  });
  html += '</div>';
});
el("qs").innerHTML = html;

document.querySelectorAll(".opt").forEach(function(b){
  b.addEventListener("click", function(){
    if(!started){ started = true; t0 = Date.now(); el("start").style.display = "none"; el("hint").textContent = "计时中——交卷后停止"; }
    var i = this.getAttribute("data-i"), c = this.getAttribute("data-c");
    picked[i] = c;
    document.querySelectorAll('.opt[data-i="'+i+'"]').forEach(function(x){x.classList.remove("sel");});
    this.classList.add("sel");
    el("done").textContent = Object.keys(picked).length;
  });
});

el("start").addEventListener("click", function(){
  started = true; t0 = Date.now();
  this.style.display = "none";
});

el("submit").addEventListener("click", function(){
  if(!started){ started = true; t0 = Date.now(); }
  var right=0, wrong=[];
  QS.forEach(function(q,i){
    var mine = picked[i], ans = q[1];
    document.querySelectorAll('.opt[data-i="'+i+'"]').forEach(function(x){
      x.classList.remove("sel");
      if(x.getAttribute("data-c")===ans) x.classList.add("ok");
      else if(mine && x.getAttribute("data-c")===mine) x.classList.add("no");
    });
    if(mine===ans) right++; else wrong.push(q[0]+"（你选"+(mine||"未答")+"，正确"+ans+"）");
  });
  var sec = Math.floor((Date.now()-t0)/1000);
  var r = el("res"); r.classList.add("on");
  r.innerHTML = '<div class="big">'+right+' / 7</div><div style="color:#6b6b70;font-size:13px">用时 '+fmt(sec)+'</div>'+
    (wrong.length?'<ul>'+wrong.map(function(w){return "<li>"+w+"</li>";}).join('')+'</ul>':'<p>全对。</p>');
  post({kind:"attempt", set:"2025四川省考·判断56-63", score:right, total:7, sec:sec, wrong:wrong});
  window.scrollTo({top:document.body.scrollHeight, behavior:"smooth"});
});

function post(o){
  try{
    if(location.protocol==="file:") return;
    fetch("/api/log",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(o)}).catch(function(){});
  }catch(e){}
}
</script>
</body>
</html>
