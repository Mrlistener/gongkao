<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>错题集</title>
<style>
:root{--ink:#1c1c1e;--muted:#6b6b70;--line:#e6e4df;--bg:#f6f5f2;--card:#fff;--green:#1e7a4b;--green-bg:#eaf6ef;--red:#b3261e;--red-bg:#fdeeed;--blue:#1f5fbf;--blue-bg:#eaf1fb}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"PingFang SC","Microsoft YaHei",system-ui,-apple-system,sans-serif;line-height:1.75;-webkit-font-smoothing:antialiased}
.wrap{max-width:820px;margin:0 auto;padding:28px 20px 90px}
h1{font-size:22px;margin:0 0 6px}
.sub{margin:0 0 18px;color:var(--muted);font-size:14px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
button{background:var(--card);border:1px solid var(--line);border-radius:9px;padding:8px 14px;font:inherit;font-size:13.5px;color:var(--ink);cursor:pointer}
button:hover{border-color:#c9c5bd}
button.dark{background:var(--ink);color:#fff;border:0}
button.danger{color:var(--red);border-color:#e8c9c7}
.stats{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:18px}
.stats h3{font-size:13px;color:var(--muted);font-weight:500;margin:0 0 10px}
.rows{display:flex;flex-direction:column;gap:7px}
.row{display:flex;align-items:center;gap:10px;font-size:14px}
.row .name{width:110px;flex:none}
.bar{flex:1;height:9px;background:#efeee9;border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--red);border-radius:99px}
.row .num{width:34px;text-align:right;color:var(--muted);font-variant-numeric:tabular-nums;font-size:13px}
.item{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:12px}
.item .head{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.tag{font-size:12px;padding:1px 9px;border-radius:999px;background:var(--blue-bg);color:var(--blue)}
.tag.warn{background:var(--red-bg);color:var(--red)}
.src{font-size:12px;color:var(--muted);margin-left:auto}
.stem{font-size:15px;margin:0 0 10px;font-weight:600}
.opt{display:flex;gap:8px;font-size:14px;padding:6px 10px;border-radius:8px;margin:4px 0;border:1px solid transparent}
.opt.ok{background:var(--green-bg);border-color:#bfe3cd}
.opt.no{background:var(--red-bg);border-color:#f0c9c6}
.opt .k{color:var(--muted);flex:none}
.sol{font-size:13.5px;color:#444;border-top:1px dashed var(--line);padding-top:10px;margin-top:10px}
.empty{background:var(--card);border:1px dashed var(--line);border-radius:12px;padding:36px;text-align:center;color:var(--muted);font-size:14px}
.hint{font-size:12.5px;color:var(--muted);margin-top:8px}
.foot{margin-top:18px;font-size:12.5px;color:var(--muted)}
</style>
</head>
<body>
<div class="wrap">
  <h1>错题集</h1>
  <p class="sub" id="sub">自动汇总所有练习页里做错的题，只存在本机浏览器。</p>

  <div class="toolbar">
    <button class="dark" id="refresh">刷新</button>
    <button id="export">导出 JSON</button>
    <button id="importBtn">导入 JSON</button>
    <input type="file" id="file" accept="application/json,.json" style="display:none">
    <button class="danger" id="clear">清空</button>
  </div>

  <section class="stats" id="stats" style="display:none">
    <h3>错误最多的类型（决定你下一步练什么）</h3>
    <div class="rows" id="rows"></div>
  </section>

  <main id="list"></main>
  <p class="foot">提示：错题集和练习页共用同一份本机存储，所以在任何一台电脑上，只能看到这台电脑做过的题。</p>
</div>

<script>
var KEYW = "kaogong_wrong_v1";
var LETTER = "ABCD";

function el(id) { return document.getElementById(id); }

function load() {
  try { return JSON.parse(localStorage.getItem(KEYW) || "[]"); } catch (e) { return []; }
}
function saveAll(arr) {
  try { localStorage.setItem(KEYW, JSON.stringify(arr)); } catch (e) {}
}

function render() {
  var arr = load();
  var list = el("list");
  var stats = el("stats");
  var sub = el("sub");

  if (!arr.length) {
    list.innerHTML = '<div class="empty">还没有错题。<br>做完练习页交卷后，答错的题会自动出现在这里。</div>';
    stats.style.display = "none";
    sub.textContent = "自动汇总所有练习页里做错的题，只存在本机浏览器。";
    return;
  }

  sub.textContent = "共 " + arr.length + " 道错题，按错误次数排序。";

  var byType = {};
  arr.forEach(function (x) {
    var t = x.type || "未分类";
    byType[t] = (byType[t] || 0) + (x.times || 1);
  });
  var types = Object.keys(byType).sort(function (a, b) { return byType[b] - byType[a]; });
  var max = byType[types[0]] || 1;
  var rows = "";
  types.forEach(function (t) {
    var w = Math.round(byType[t] * 100 / max);
    rows += '<div class="row"><span class="name">' + esc(t) + '</span><span class="bar"><i style="width:' + w + '%"></i></span><span class="num">' + byType[t] + '</span></div>';
  });
  el("rows").innerHTML = rows;
  stats.style.display = "block";

  arr.sort(function (a, b) {
    var d = (b.times || 1) - (a.times || 1);
    if (d !== 0) return d;
    return (b.at || "").localeCompare(a.at || "");
  });

  var html = "";
  arr.forEach(function (x) {
    var opts = "";
    (x.options || []).forEach(function (text, i) {
      var cls = "";
      if (i === x.answer) cls = "ok";
      if (i === x.mine && x.mine !== x.answer) cls = "no";
      var mark = "";
      if (i === x.answer) mark = "　✓ 正确答案";
      else if (i === x.mine) mark = "　✗ 你选的";
      opts += '<div class="opt ' + cls + '"><span class="k">' + LETTER[i] + '.</span><span>' + esc(text) + mark + '</span></div>';
    });
    var mineText = (x.mine === null || x.mine === undefined) ? "未作答" : (LETTER[x.mine] + " 项");
    html += '<div class="item">' +
      '<div class="head">' +
        '<span class="tag">' + esc(x.type || "未分类") + '</span>' +
        (x.times > 1 ? '<span class="tag warn">错过 ' + x.times + ' 次</span>' : '') +
        '<span class="src">' + esc(x.set || "") + '</span>' +
      '</div>' +
      '<p class="stem">' + esc(x.stem) + '</p>' + opts +
      '<div class="sol"><b>你选：</b>' + mineText + '　<b>正确：</b>' + LETTER[x.answer] + '<br>' + (x.solution || "") + '</div>' +
      '<div class="toolbar" style="margin:10px 0 0"><button data-del="' + esc(x.id) + '">从错题集移除</button></div>' +
    '</div>';
  });
  list.innerHTML = html;

  var btns = list.querySelectorAll("button[data-del]");
  for (var i = 0; i < btns.length; i++) {
    btns[i].addEventListener("click", function () {
      var id = this.getAttribute("data-del");
      var rest = load().filter(function (y) { return y.id !== id; });
      saveAll(rest);
      render();
    });
  }
}

function esc(s) {
  return String(s === undefined || s === null ? "" : s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

el("refresh").addEventListener("click", render);

el("clear").addEventListener("click", function () {
  if (confirm("确定清空全部错题？此操作不可撤销。")) {
    saveAll([]);
    render();
  }
});

el("export").addEventListener("click", function () {
  var data = JSON.stringify(load(), null, 2);
  var blob = new Blob([data], { type: "application/json" });
  var a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "错题集-" + new Date().toISOString().slice(0, 10) + ".json";
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
});

el("importBtn").addEventListener("click", function () { el("file").click(); });

el("file").addEventListener("change", function (e) {
  var f = e.target.files[0];
  if (!f) return;
  var reader = new FileReader();
  reader.onload = function () {
    try {
      var incoming = JSON.parse(reader.result);
      if (!Array.isArray(incoming)) throw new Error("not array");
      var cur = load();
      var map = {};
      cur.forEach(function (x) { map[x.id] = x; });
      incoming.forEach(function (x) {
        if (!x || !x.id) return;
        if (map[x.id]) { map[x.id].times = Math.max(map[x.id].times || 1, x.times || 1); }
        else { cur.push(x); }
      });
      saveAll(cur);
      render();
      alert("已导入 " + incoming.length + " 条记录");
    } catch (err) {
      alert("导入失败：文件格式不对");
    }
  };
  reader.readAsText(f, "utf-8");
  e.target.value = "";
});

render();
</script>
</body>
</html>
