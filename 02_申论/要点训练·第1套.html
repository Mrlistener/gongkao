<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>申论作答 · 第 1 套</title>
<style>
:root{--ink:#1c1c1e;--muted:#6b6b70;--line:#e6e4df;--bg:#f6f5f2;--card:#fff;--green:#1e7a4b;--green-bg:#eaf6ef;--red:#b3261e;--red-bg:#fdeeed;--blue:#1f5fbf;--blue-bg:#eaf1fb;--amber:#8a5a00;--amber-bg:#fdf4e3}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"PingFang SC","Microsoft YaHei",system-ui,-apple-system,sans-serif;line-height:1.8;-webkit-font-smoothing:antialiased}
.wrap{max-width:820px;margin:0 auto;padding:28px 20px 90px}
h1{font-size:22px;margin:0 0 6px}
.sub{color:var(--muted);font-size:14px;margin:0 0 18px}
.bar{display:flex;gap:16px;font-size:13px;color:var(--muted);margin-bottom:14px;flex-wrap:wrap}
.bar b{color:var(--ink);font-variant-numeric:tabular-nums}
.material{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px;font-size:15px;margin-bottom:18px}
.material p{margin:0 0 10px}
.material p:last-child{margin:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px 16px;margin-bottom:14px}
.head{display:flex;gap:8px;align-items:center;margin-bottom:8px;flex-wrap:wrap}
.no{font-size:12px;background:var(--ink);color:#fff;border-radius:999px;padding:1px 9px}
.ptype{font-size:12px;background:var(--blue-bg);color:var(--blue);border-radius:999px;padding:1px 9px}
.ask{font-size:15px;font-weight:600;margin:0 0 10px}
textarea{width:100%;min-height:150px;border:1px solid var(--line);border-radius:9px;padding:12px 14px;font:inherit;font-size:14.5px;line-height:1.9;resize:vertical;background:#fbfbfa}
textarea:focus{outline:none;border-color:#c9c5bd}
.foot{display:flex;gap:12px;align-items:center;margin-top:10px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.foot .cnt{font-variant-numeric:tabular-nums}
.foot .cnt.over{color:var(--red);font-weight:600}
button{border-radius:9px;padding:9px 16px;font:inherit;font-size:14px;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--ink)}
button.dark{background:var(--ink);color:#fff;border:0}
button.done{background:var(--green-bg);color:var(--green);border-color:#bfe3cd}
.tip{background:var(--amber-bg);color:var(--amber);border-radius:9px;padding:10px 12px;font-size:13px;margin:14px 0}
.sum{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-top:16px;display:none}
.sum.on{display:block}
.sum .big{font-size:28px;font-weight:700}
</style>
</head>
<body>
<div class="wrap">
  <h1>申论作答 · 第 1 套</h1>
  <p class="sub">按题目要求写完整答案。写完点「提交」，会在对话里逐题批改（不用对照任何参考答案）。</p>

  <div class="bar">
    <span>已提交 <b id="done">0</b> / 5</span>
    <span>总字数 <b id="total">0</b></span>
    <span id="clock">00:00</span>
  </div>

  <section class="material" id="mat"></section>
  <main id="qs"></main>

  <div class="tip">批改标准：要点覆盖（60%）、分条与条理（20%）、格式与结构（15%）、语言与字数（5%）。格式分是最容易白拿的，别丢。</div>

  <section class="sum" id="sum"></section>
</div>

<script>
var MATERIAL = [
  "<p>H 市近年来推进基层综合行政执法改革。2023 年起，全市 87 个乡镇（街道）设立综合行政执法队，整合城管、市场监管、生态环境等 8 个领域的执法事项，实行「一支队伍管执法」。</p>",
  "<p>为解决「看得见管不着」的问题，H 市建立「街乡吹哨、部门报到」机制：乡镇发现违法行为后，通过平台「吹哨」，相关区级部门 2 小时内响应、24 小时内到场处置。2024 年共吹哨 3.2 万次，办结率 96%。</p>",
  "<p>在执法方式上，H 市推行「首违不罚」清单，对 12 类轻微违法行为实行告知承诺、限期整改；同时建立「执法回访」制度，对已处罚企业每季度回访一次。市司法局负责人说：「处罚不是目的，让企业合规经营才是目的。」</p>",
  "<p>不过，改革也遇到困难。部分乡镇执法队人员编制不足，一人身兼数职；执法装备老旧，缺少取证设备；一些部门「报到」流于形式，只派人不到场；还有群众反映，个别执法队员态度生硬，解释政策不到位。</p>",
  "<p>2025 年，H 市计划将执法事项清单动态调整，把群众反映强烈的噪声扰民、餐饮油烟等纳入重点；同时开展执法队伍全员轮训，每周一次业务学习。</p>"
].join("");

var QS = [
  { type: "归纳概括", ask: "根据材料，概括 H 市推进基层综合行政执法改革的主要做法。", req: "15 分，不超过 250 字", limit: 250 },
  { type: "综合分析", ask: "请谈谈对「处罚不是目的，让企业合规经营才是目的」这句话的理解。", req: "20 分，不超过 300 字", limit: 300 },
  { type: "提出对策", ask: "针对材料反映的问题，提出解决建议。", req: "20 分，不超过 300 字", limit: 300 },
  { type: "贯彻执行", ask: "假如你是 H 市司法局工作人员，请就本市「首违不罚」改革写一份工作简报，供市领导参阅。", req: "25 分，不超过 400 字", limit: 400 },
  { type: "文章写作", ask: "以「执法的力度与温度」为题，写一篇议论文。", req: "40 分，800–1000 字", limit: 1000 }
];

var DONE = 0;
var t0 = Date.now();

function el(id) { return document.getElementById(id); }
function fmt(s) { var m = String(Math.floor(s / 60)).padStart(2, "0"); return m + ":" + String(s % 60).padStart(2, "0"); }
function tick() { el("clock").textContent = fmt(Math.floor((Date.now() - t0) / 1000)); }

function post(obj) {
  try {
    if (location.protocol === "file:") return Promise.resolve();
    return fetch("/api/log", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(obj) });
  } catch (e) { return Promise.resolve(); }
}

function render() {
  el("mat").innerHTML = MATERIAL;
  var html = "";
  QS.forEach(function (q, qi) {
    html += '<div class="card">';
    html += '<div class="head"><span class="no">第 ' + (qi + 1) + ' 题</span><span class="ptype">' + q.type + '</span></div>';
    html += '<p class="ask">' + q.ask + '</p>';
    html += '<div class="foot" style="margin:0 0 8px"><span>' + q.req + '</span></div>';
    html += '<textarea id="ta' + qi + '" placeholder="直接写完整答案"></textarea>';
    html += '<div class="foot"><span class="cnt" id="cnt' + qi + '">0 字</span><button class="dark" data-sub="' + qi + '">提交第 ' + (qi + 1) + ' 题</button><span id="st' + qi + '"></span></div>';
    html += '</div>';
  });
  el("qs").innerHTML = html;

  QS.forEach(function (q, qi) {
    var ta = el("ta" + qi);
    ta.addEventListener("input", function () {
      var n = ta.value.replace(/\s/g, "").length;
      var c = el("cnt" + qi);
      c.textContent = n + " 字" + (q.limit ? " / " + q.limit : "");
      c.classList.toggle("over", n > q.limit * 1.1);
      updateTotal();
    });
  });

  var btns = document.querySelectorAll("button[data-sub]");
  for (var i = 0; i < btns.length; i++) {
    btns[i].addEventListener("click", function () {
      var qi = parseInt(this.getAttribute("data-sub"), 10);
      submit(qi, this);
    });
  }
  tick();
  setInterval(tick, 1000);
}

function updateTotal() {
  var t = 0;
  for (var i = 0; i < QS.length; i++) {
    var ta = el("ta" + i);
    if (ta) t += ta.value.replace(/\s/g, "").length;
  }
  el("total").textContent = t;
}

function submit(qi, btn) {
  var q = QS[qi];
  var ta = el("ta" + qi);
  var text = ta.value.trim();
  if (text.length < 20) { alert("太短了，先写完再提交"); return; }
  var n = text.replace(/\s/g, "").length;
  post({ kind: "shenlun_answer", set: "申论作答第1套", q: qi + 1, type: q.type, ask: q.ask, req: q.req, words: n, text: text })
    .then(function () {
      btn.textContent = "已提交";
      btn.classList.add("done");
      btn.disabled = true;
      el("st" + qi).textContent = "已保存，等批改";
      DONE++;
      el("done").textContent = DONE;
      if (DONE >= QS.length) {
        var s = el("sum");
        s.classList.add("on");
        s.innerHTML = '<div>5 题全部提交</div><div class="big">去对话里说一声「批改」</div><div style="font-size:13px;color:#6b6b70;margin-top:6px">我会读 04_错题与笔记/申论作答.jsonl 逐题给分</div>';
      }
    });
}

render();
</script>
</body>
</html>
